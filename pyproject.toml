[project]
name = "easy-hyperlink"
version = "0.1.0"
description = "Create and copy named hyperlinks with Django and FastAPI"
readme = "README.md"
authors = [
    { name = "Oscar Eustate" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
easy-hyperlink = "easy_hyperlink:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
